</head>

<body>

<!-- ================= CONTACT ================= -->

<main>

  <section class="contact-section">

    <div class="container">

      <div class="contact-card reveal">

        <!-- ================= INFO KONTAK ================= -->

        <div class="contact-info">

          <p class="eyebrow">
            CONTACT ME
          </p>

          <h1>
            Hubungi Aku
          </h1>

          <p class="contact-description">
          </p>


          <div class="contact-detail">

            <!-- INSTAGRAM -->

            <div class="contact-item">

              <div class="contact-icon">
                📸
              </div>

              <div>

                <h3>
                  Instagram:
                </h3>

                <a
                  href="https://instagram.com/nur_agifah"
                  target="_blank"
                  rel="noopener"
                >
                  @nur_agifah
                </a>

              </div>

            </div>


            <!-- EMAIL -->

            <div class="contact-item">

              <div class="contact-icon">
                📧
              </div>

              <div>

                <h3>
                  Email:
                </h3>

                <a href="mailto:nuragifahlulu@gmail.com">
                  nuragifahlulu@gmail.com
                </a>

              </div>

            </div>


            <!-- WHATSAPP -->

            <div class="contact-item">

              <div class="contact-icon">
                💬
              </div>

              <div>

                <h3>
                  WhatsApp:
                </h3>

                <a
                  href="https://wa.me/6282292843439"
                  target="_blank"
                  rel="noopener"
                >
                  082292843439
                </a>

              </div>

            </div>


            <!-- GITHUB -->

            <div class="contact-item">

              <div class="contact-icon">
                💻
              </div>

              <div>

                <h3>
                  GitHub:
                </h3>

                <a
                  href="https://github.com/nuragifah/nuragifah_portofolio"
                  target="_blank"
                  rel="noopener"
                >
                  @nuragifah
                </a>

              </div>

            </div>

          </div>

        </div>


        <!-- ================= FORM ================= -->

        <div class="contact-form">

          <div class="form-title">

            <span></span>

            <h2>
              Kirim Pesan
            </h2>

          </div>


          <form
            action="mailto:nuragifahlulu@gmail.com"
            method="post"
            enctype="text/plain"
          >

            <!-- NAMA -->

            <div class="form-group">

              <label for="nama">
                Nama:
              </label>

              <input
                type="text"
                id="nama"
                name="Nama"
                placeholder="Masukkan nama kamu"
                required
              >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

              <label for="email">
                Email:
              </label>

              <input
                type="email"
                id="email"
                name="Email"
                placeholder="Masukkan email kamu"
                required
              >

            </div>


            <!-- PESAN -->

            <div class="form-group">

              <label for="pesan">
                Pesan:
              </label>

              <textarea
                id="pesan"
                name="Pesan"
                rows="5"
                placeholder="Tulis pesan kamu..."
                required
              ></textarea>

            </div>


            <!-- TOMBOL -->

            <button
              type="submit"
              class="send-button"
            >
              Kirim Pesan
            </button>

          </form>

        </div>

      </div>

    </div>

  </section>

</main>


<!-- ================= FOOTER ================= -->

<footer>

  <div class="container">

    Terima kasih sudah mengunjungi portofolio saya ♡

  </div>

</footer>

<script src="js/script.js"></script>
